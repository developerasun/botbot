networks:
  side:
    driver: overlay

services:
  botbot:
    image: hub-botbot:latest
    ports:
      - "3014:3014"
    volumes:
      - ./.run.env:/botbot/.run.env
    networks:
      - side
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any # no always policy on swarm mode
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        reservations:
          cpus: "0.01"
          memory: 128M
        limits:
          cpus: "0.01"
          memory: 128M